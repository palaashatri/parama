name: PARAMA nightly ISO

# Publishes the bootable ISO from main to the rolling "nightly" pre-release.
# The ISO is only published after it passes the same QEMU/OVMF M1 boot gate as
# CI. It is a kernel boot diagnostic, not an installable desktop OS.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: parama-nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nightly:
    # Manual runs on other refs build and test but never replace the main nightly.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this commit's nightly is already published
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Judge by the published release's assets, not the tag, so a run
          # that moved the tag but failed to upload is retried next time.
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" \
            --jq "[.assets[].name | select(startswith(\"parama-nightly-${GITHUB_SHA::7}\"))] | length" 2>/dev/null || echo 0)"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${published:-0}" -ge 1 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux build and VM prerequisites
        if: steps.gate.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libclang-rt-dev cmake ninja-build curl xorriso \
            build-essential qemu-system-x86 ovmf python3
      - name: Build verified Limine UEFI ISO
        if: steps.gate.outputs.build == 'true'
        run: bash tools/scripts/build.sh
      - name: Host tests and M1 boot gate
        if: steps.gate.outputs.build == 'true'
        run: |
          bash tools/scripts/check.sh
          # The full M1 gate (10 cold boots per mode), same as main CI.
          bash tools/scripts/run_qemu_qa.sh --runs 10 --resolution 800x600 --resolution 640x480
      - name: Preserve VM serial and screenshot evidence
        if: always() && steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parama-nightly-evidence
          path: |
            build/qemu-com1.log
            build/qa/qemu/**/*.log
            build/qa/qemu/**/*.png
            build/qa/qemu/summary.txt
          if-no-files-found: warn
      - name: Stage nightly assets
        if: steps.gate.outputs.build == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          mkdir -p dist
          cp build/parama.iso "dist/parama-nightly-${short}.iso"
          cp build/brahma.elf "dist/brahma-nightly-${short}.elf"
          cat > dist/README.txt <<TXT
          PARAMA nightly ${GITHUB_SHA}
          This ISO boots BRAHMA's M1 kernel diagnostic under UEFI (QEMU/OVMF or
          VirtualBox 7.2). It is not a desktop operating system yet.
            qemu-system-x86_64 -machine q35 -m 512M \\
              -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \\
              -cdrom parama-nightly-${short}.iso -serial stdio
          TXT
          (cd dist && sha256sum parama-nightly-* brahma-nightly-* > SHA256SUMS.txt)
      - name: Publish rolling nightly release
        if: steps.gate.outputs.build == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            # Replace old assets so the release only carries the current build.
            for asset in $(gh release view nightly --json assets --jq '.assets[].name'); do
              gh release delete-asset nightly "$asset" --yes
            done
            gh release edit nightly --title "PARAMA nightly (${GITHUB_SHA::7})" --prerelease \
              --notes "Bootable M1 diagnostic ISO from ${GITHUB_SHA}. Passed the QEMU/OVMF boot gate. See README.txt."
          else
            gh release create nightly --prerelease --title "PARAMA nightly (${GITHUB_SHA::7})" \
              --notes "Bootable M1 diagnostic ISO from ${GITHUB_SHA}. Passed the QEMU/OVMF boot gate. See README.txt."
          fi
          gh release upload nightly dist/* --clobber
