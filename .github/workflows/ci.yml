name: PARAMA build and virtual-machine smoke test
on:
  push:
  pull_request:
jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and VM prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libclang-rt-dev cmake ninja-build curl xorriso \
            build-essential qemu-system-x86 ovmf python3
      - name: Build verified Limine UEFI ISO
        run: bash tools/scripts/build.sh
      - name: Run memory, framebuffer, and ELF host tests
        run: bash tools/scripts/check.sh
      - name: M1 gate under OVMF/QEMU (10 cold boots x 3 modes, COM1 + pixel-exact screen)
        run: bash tools/scripts/run_qemu_qa.sh --runs 10 --resolution 800x600 --resolution 640x480
      - name: Preserve VM serial and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parama-ci-evidence
          path: |
            build/qemu-com1.log
            build/qa/qemu/**/*.log
            build/qa/qemu/**/*.png
            build/qa/qemu/summary.txt
            build/brahma.elf
          if-no-files-found: warn
